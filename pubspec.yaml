name: store_ph
description: StorePH - Sari-Sari Store Management App
publish_to: 'none'
version: 1.0.24+36

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # UI
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.19.0
  timezone: ^0.9.4
  share_plus: ^12.0.2
  path_provider: ^2.1.3
  file_picker: ^8.0.7
  permission_handler: ^11.3.1
  uuid: ^4.4.2
  shared_preferences: ^2.3.1
  http: ^1.2.2
  crypto: ^3.0.6
  csv: ^6.0.0

  # Features
  mobile_scanner: ^7.4.0
  gal: ^1.9.1

  # Notifications
  flutter_local_notifications: ^17.2.2

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Splash Screen & Icons
  flutter_native_splash: ^2.4.0
  local_auth: ^3.0.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/mascot/
    - assets/banks-and-e-wallets/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_foreground_padding: 0
  web:
    generate: false

flutter_native_splash:
  color: "#0B3CCC"
  image: assets/icon.png
  fullscreen: true
  android_12:
    image: assets/icon.png
    icon_background_color: "#0B3CCC"
    color: "#0B3CCC"