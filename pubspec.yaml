name: tinda_ph
description: TindaPH - Sari-Sari Store Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # UI
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  timezone: ^0.9.4
  share_plus: ^12.0.2
  path_provider: ^2.1.3
  file_picker: ^8.0.7
  permission_handler: ^11.3.1
  uuid: ^4.4.2
  shared_preferences: ^2.3.1

  # Features
  mobile_scanner: ^7.2.0
  gal: ^1.9.1

  # Notifications
  flutter_local_notifications: ^17.2.2

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Splash Screen & Icons
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/icon.png"
  web:
    generate: false

flutter_native_splash:
  color: "#1E3A8A"
  image: assets/icon.png
  fullscreen: true
  android_12:
    image: assets/icon.png
    icon_background_color: "#1E3A8A"
    color: "#1E3A8A"