name: tinda_ph
description: TindaPH - Sari-Sari Store Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  provider: ^6.1.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  file_picker: ^8.0.7
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  uuid: ^4.4.2
  shared_preferences: ^2.3.1
  mobile_scanner: ^5.2.3
  gal: ^1.2.2
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0038A8"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#0038A8"
  image: assets/icon.png
  android_12:
    image: assets/icon.png
    color: "#0038A8"